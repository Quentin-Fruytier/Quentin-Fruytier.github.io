<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} &middot; {% endif %}Quentin Fruytier</title>

  <meta name="author" content="Quentin Fruytier">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.summary | default: site.description | strip_newlines | strip | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Quentin Fruytier">
  <meta property="og:title" content="{% if page.title and page.url != '/' %}{{ page.title | escape }} &middot; {% endif %}Quentin Fruytier">
  <meta property="og:description" content="{{ page.summary | default: site.description | strip_newlines | strip | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/images/me2026.jpg' | absolute_url }}">
  <meta name="twitter:card" content="summary">

  <link rel="stylesheet" type="text/css" href="{{ '/stylesheet.css' | relative_url }}">
  <link rel="icon" type="image/png" sizes="64x64" href="{{ '/images/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/apple-touch-icon.png' | relative_url }}">
</head>

<body>
  <div class="nav-wrap">
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} class="active"{% endif %}>Home</a>
      <a href="{{ '/projects/' | relative_url }}"{% if page.nav_active == "projects" %} class="active"{% endif %}>Projects</a>
      <a href="{{ '/blog/' | relative_url }}"{% if page.nav_active == "blog" %} class="active"{% endif %}>Blog</a>
    </nav>
  </div>

  {{ content }}
</body>
</html>
